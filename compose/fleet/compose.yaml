# Fleet: server, one-shot migration, MySQL, and Redis. Ported from
# the retired K3s manifests (kubernetes/apps/fleet, now only in git history).
#
# Changes from the K8s version:
# - Fleet serves plain HTTP (FLEET_SERVER_TLS=false). cloudflared terminates
#   TLS. The cert-manager certificate is gone.
# - `fleet prepare db` runs as its own one-shot service (was an init container).
# - A one-shot service sets ownership on the vulndb and logs volumes, because
#   the Fleet image runs as uid 100 and new named volumes are root-owned.
#
# Profiles: services without a profile (MySQL, Redis) always deploy. The
# `app` profile adds the migration and the server. It stays off until the
# database restore is done (see vps/README.md).
#
# Secrets (from 1Password through .doco-cd.yml):
#   MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD, FLEET_SERVER_PRIVATE_KEY,
#   FLEET_LICENSE_KEY, FLEET_S3_SOFTWARE_INSTALLERS_BUCKET,
#   FLEET_S3_SOFTWARE_INSTALLERS_ACCESS_KEY_ID,
#   FLEET_S3_SOFTWARE_INSTALLERS_SECRET_ACCESS_KEY

x-fleet-mysql-env: &fleet-mysql-env
  FLEET_MYSQL_ADDRESS: fleet-mysql:3306
  FLEET_MYSQL_DATABASE: fleet
  FLEET_MYSQL_USERNAME: fleet
  FLEET_MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}

services:
  fleet-mysql:
    image: mysql:8.0.46
    command:
      # Default is 128Mi, far too small for ~25 hosts' worth of
      # label_membership/query_results churn; was causing sustained
      # InnoDB row-lock waits and Fleet /healthz timeouts.
      - "--innodb-buffer-pool-size=1073741824"
      # Single instance, no replicas/point-in-time recovery use binlogs
      # here. Unbounded binlog growth (no expiry ever ran because the
      # server kept crashing before it could purge) filled the 20Gi PVC
      # and took mysqld down with "No space left on device".
      - "--skip-log-bin"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: fleet
      MYSQL_USER: fleet
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - fleet_mysql:/var/lib/mysql
    restart: unless-stopped
    mem_limit: 2g # buffer pool stays at 1 GB
    healthcheck:
      # TCP, not the socket: during first-boot init the entrypoint runs a
      # temporary server with networking off, so this only passes once the
      # real server is up.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  fleet-redis:
    image: redis:7.4.12-alpine
    # No persistence, same as before. Fleet rebuilds what it keeps here.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  fleet-volume-perms:
    image: busybox:1.38.0
    profiles: [app]
    command: ["sh", "-c", "chown -R 100:101 /var/lib/fleet/vulndb /var/log/fleet"]
    volumes:
      - fleet_vulndb:/var/lib/fleet/vulndb
      - fleet_logs:/var/log/fleet
    restart: "no"

  fleet-migrate:
    image: fleetdm/fleet:v4.95.0
    profiles: [app]
    command: ["fleet", "prepare", "db", "--no-prompt"]
    environment:
      <<: *fleet-mysql-env
    depends_on:
      fleet-mysql:
        condition: service_healthy
    restart: "no"

  fleet:
    image: fleetdm/fleet:v4.95.0
    profiles: [app]
    command: ["fleet", "serve"]
    environment:
      <<: *fleet-mysql-env
      # Server
      FLEET_SERVER_ADDRESS: 0.0.0.0:8080
      FLEET_SERVER_TLS: "false"
      FLEET_LOGGING_JSON: "true"
      FLEET_SERVER_MAX_INSTALLER_SIZE: 20G
      FLEET_SESSION_DURATION: 1h
      # Redis
      FLEET_REDIS_ADDRESS: fleet-redis:6379
      # Secrets
      FLEET_SERVER_PRIVATE_KEY: ${FLEET_SERVER_PRIVATE_KEY:?FLEET_SERVER_PRIVATE_KEY is required}
      FLEET_LICENSE_KEY: ${FLEET_LICENSE_KEY:?FLEET_LICENSE_KEY is required}
      # Software installers in external AWS S3, static keys from 1Password
      FLEET_S3_SOFTWARE_INSTALLERS_BUCKET: ${FLEET_S3_SOFTWARE_INSTALLERS_BUCKET:?FLEET_S3_SOFTWARE_INSTALLERS_BUCKET is required}
      FLEET_S3_SOFTWARE_INSTALLERS_ACCESS_KEY_ID: ${FLEET_S3_SOFTWARE_INSTALLERS_ACCESS_KEY_ID:?FLEET_S3_SOFTWARE_INSTALLERS_ACCESS_KEY_ID is required}
      FLEET_S3_SOFTWARE_INSTALLERS_SECRET_ACCESS_KEY: ${FLEET_S3_SOFTWARE_INSTALLERS_SECRET_ACCESS_KEY:?FLEET_S3_SOFTWARE_INSTALLERS_SECRET_ACCESS_KEY is required}
      FLEET_S3_SOFTWARE_INSTALLERS_REGION: us-east-1
      # Vulnerability scanning
      FLEET_VULNERABILITIES_DATABASES_PATH: /var/lib/fleet/vulndb
      # Fleet's default. 5m (carried over from K3s) kept MySQL near a full core.
      FLEET_VULNERABILITIES_PERIODICITY: 1h
      FLEET_VULNERABILITIES_CURRENT_INSTANCE_CHECKS: "yes"
      # Osquery
      FLEET_OSQUERY_HOST_IDENTIFIER: uuid
      FLEET_OSQUERY_LABEL_UPDATE_INTERVAL: 1m
    volumes:
      - fleet_vulndb:/var/lib/fleet/vulndb
      - fleet_logs:/var/log/fleet
    networks: [default, proxy]
    depends_on:
      fleet-mysql:
        condition: service_healthy
      fleet-redis:
        condition: service_healthy
      fleet-volume-perms:
        condition: service_completed_successfully
      fleet-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 2g
    healthcheck:
      # The image is Alpine, so busybox wget is available.
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  default:
    # Fixed name so the backup stack can reach fleet-mysql.
    name: fleet-backend
  proxy:
    external: true

volumes:
  fleet_mysql:
    name: fleet_mysql
  # Rebuilt by Fleet on its own, so it is not backed up.
  fleet_vulndb:
    name: fleet_vulndb
  fleet_logs:
    name: fleet_logs
