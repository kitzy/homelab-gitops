# Cloudflare Tunnel connector. Public hostnames (auth, fleet) reach the apps
# through this one outbound connection. The VM has no inbound ports.
#
# Hostname -> service routing is not set here. It is generated by the dns/
# Terraform from the TUNNEL records in dns/dns_zones/kitzy.net.yml, using
# the tunnel defined in dns/cloudflare_tunnels.yml.
#
# Secrets (from 1Password through .doco-cd.yml): TUNNEL_TOKEN

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
      # Metrics and the /ready endpoint, used by the healthcheck below.
      TUNNEL_METRICS: 127.0.0.1:20241
    networks: [proxy]
    restart: unless-stopped
    mem_limit: 192m
    healthcheck:
      # /ready returns 200 once at least one connection to Cloudflare is up.
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  # Created by cloud-init. Only cloudflared and the apps' HTTP services join it.
  proxy:
    external: true
