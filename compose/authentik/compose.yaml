# Authentik: server, worker, and Postgres. Ported from the retired K3s manifests
# (kubernetes/apps/authentik, now only in git history).
#
# Changes from the K8s version:
# - The nginx TLS sidecar and the cert-manager certificate are gone.
#   cloudflared reaches the server over plain HTTP on the proxy network.
# - The worker now shares the media volume with the server.
# - No Redis. Authentik 2025.10 does not use it.
#
# Profiles: services without a profile (the database) always deploy. The
# `app` profile adds everything else. It stays off until the database
# restore is done (see vps/README.md).
#
# Secrets (from 1Password through .doco-cd.yml):
#   AUTHENTIK_PG_DB, AUTHENTIK_PG_USER, AUTHENTIK_PG_PASSWORD,
#   AUTHENTIK_SECRET_KEY, AUTHENTIK_HOST, AUTHENTIK_COOKIE_DOMAIN

x-authentik-env: &authentik-env
  AUTHENTIK_POSTGRESQL__HOST: authentik-db
  AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_PG_DB:?AUTHENTIK_PG_DB is required}
  AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_PG_USER:?AUTHENTIK_PG_USER is required}
  AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASSWORD:?AUTHENTIK_PG_PASSWORD is required}
  # Must match the old value, or encrypted fields and sessions break.
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY is required}
  AUTHENTIK_HOST: ${AUTHENTIK_HOST:?AUTHENTIK_HOST is required}
  AUTHENTIK_COOKIE_DOMAIN: ${AUTHENTIK_COOKIE_DOMAIN:?AUTHENTIK_COOKIE_DOMAIN is required}
  AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
  AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
  AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
  AUTHENTIK_LOG_LEVEL: info

services:
  authentik-db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: ${AUTHENTIK_PG_DB:?AUTHENTIK_PG_DB is required}
      POSTGRES_USER: ${AUTHENTIK_PG_USER:?AUTHENTIK_PG_USER is required}
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASSWORD:?AUTHENTIK_PG_PASSWORD is required}
    volumes:
      - authentik_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Replaces the old fix-permissions init container. The server and worker
  # run as uid 1000 and need to write /media.
  authentik-media-perms:
    image: busybox:1.38.0
    profiles: [app]
    command: ["sh", "-c", "mkdir -p /media/public && chown -R 1000:1000 /media"]
    volumes:
      - authentik_media:/media
    restart: "no"

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.5.8
    profiles: [app]
    command: server
    environment:
      <<: *authentik-env
      AUTHENTIK_LISTEN__HTTP: 0.0.0.0:9000
      AUTHENTIK_WEB__WORKERS: "2"
      # Docker bridge networks, where cloudflared connects from.
      AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: 172.16.0.0/12
      AUTHENTIK_AVATARS: gravatar,initials
    volumes:
      - authentik_media:/media
    networks: [default, proxy]
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-media-perms:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 3g
    healthcheck:
      # Checks /-/health/live/ on port 9000. The first boot after a restore
      # runs migrations, and the old probes waited 300 s, so allow a long start.
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.5.8
    profiles: [app]
    command: worker
    environment:
      <<: *authentik-env
    volumes:
      - authentik_media:/media
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-media-perms:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

networks:
  default:
    # Fixed name so the backup stack can reach authentik-db.
    name: authentik-backend
  proxy:
    external: true

volumes:
  authentik_pgdata:
    name: authentik_pgdata
  authentik_media:
    # Fixed name so the backup stack can mount it read-only.
    name: authentik_media
