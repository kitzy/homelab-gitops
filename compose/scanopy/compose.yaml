# Scanopy: server, Postgres, and a Tailscale sidecar. Ported from
# kubernetes/apps/scanopy.
#
# Scanopy is tailnet-only. The sidecar joins the tailnet as `scanopy`
# (scanopy.tail26a1d8.ts.net) and serves HTTPS 443 to the server. The daemon
# on homelab-01 pushes to that URL.
#
# The server image is pinned to v0.19.6, the newest release before the
# cluster went down (v0.20.0 shipped after). The cluster ran an unpinned
# `latest`, so the restore runbook checks the dump's migrations against this
# version before restoring.
#
# Profiles: services without a profile (the database) always deploy. The
# `app` profile adds the server and the sidecar. It stays off until the
# database restore is done (see vps/README.md).
#
# Secrets (from 1Password through .doco-cd.yml): POSTGRES_PASSWORD, TS_AUTHKEY

services:
  scanopy-db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: scanopy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - scanopy_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scanopy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  scanopy-server:
    image: ghcr.io/scanopy/scanopy/server:v0.19.6
    profiles: [app]
    environment:
      SCANOPY_LOG_LEVEL: info
      SCANOPY_SERVER_PORT: "60072"
      # Built here instead of using DATABASE_URL from 1Password, which points
      # at the old K8s service name. The password is URL-safe (checked).
      SCANOPY_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@scanopy-db:5432/scanopy
      SCANOPY_WEB_EXTERNAL_PATH: /app/static
      SCANOPY_PUBLIC_URL: https://scanopy.tail26a1d8.ts.net
      SCANOPY_INTEGRATED_DAEMON_URL: "" # the daemon uses push mode
    depends_on:
      scanopy-db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:60072/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  scanopy-ts:
    image: tailscale/tailscale:v1.104.7
    profiles: [app]
    hostname: scanopy
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY is required}
      TS_HOSTNAME: scanopy
      TS_EXTRA_ARGS: --advertise-tags=tag:vps
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Userspace networking: no /dev/net/tun or NET_ADMIN needed. Serve works.
      TS_USERSPACE: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    configs:
      - source: scanopy_serve
        target: /config/serve.json
    volumes:
      - scanopy_ts_state:/var/lib/tailscale
    depends_on:
      scanopy-server:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

configs:
  scanopy_serve:
    # $$ escapes Compose interpolation. containerboot fills in TS_CERT_DOMAIN.
    content: |
      {
        "TCP": {"443": {"HTTPS": true}},
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": {"/": {"Proxy": "http://scanopy-server:60072"}}
          }
        }
      }

networks:
  default:
    # Fixed name so the backup stack can reach scanopy-db.
    name: scanopy-backend

volumes:
  scanopy_pgdata:
    name: scanopy_pgdata
  # Tailscale node state. Keeps the `scanopy` identity across restarts.
  scanopy_ts_state:
    name: scanopy_ts_state
