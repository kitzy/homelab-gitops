zone_name: "kitzysound.com"
provider: cloudflare
# DNS for kitzysound.com has been moved to a separate Cloudflare account,
# managed in a different repository. This repo ONLY updates the registrar
# nameservers (below) and must NOT manage the hosted zone or any DNS records
# for this domain.
#
# registrar_only: true excludes this zone from the Terraform-managed hosted
# zone/records and from the nightly cleanup scripts, while the apex NS records
# still drive the registrar nameserver update at AWS Route53 Domains.
registrar_only: true
records:
  - name: "kitzysound.com"
    type: "NS"
    ttl: 172800
    values:
      - "edward.ns.cloudflare.com"
      - "ziggy.ns.cloudflare.com"
