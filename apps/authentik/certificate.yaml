apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authentik-tls
  namespace: authentik
spec:
  secretName: authentik-tls
  duration: 2160h     # 90 days
  renewBefore: 720h   # renew 30 days before expiry
  privateKey:
    rotationPolicy: Always
  dnsNames:
  - auth.kitzy.net
  - authentik-server.authentik.svc.cluster.local
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
