apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
    creationPolicy: Owner
  data:
    - secretKey: postgres-user
      remoteRef:
        key: authentik-secrets
        property: POSTGRES_USER
    - secretKey: postgres-db
      remoteRef:
        key: authentik-secrets
        property: POSTGRES_DB
    - secretKey: postgres-password
      remoteRef:
        key: authentik-secrets
        property: POSTGRES_PASSWORD
    - secretKey: secret-key
      remoteRef:
        key: authentik-secrets
        property: AUTHENTIK_SECRET_KEY
    - secretKey: host
      remoteRef:
        key: authentik-secrets
        property: AUTHENTIK_HOST
    - secretKey: url
      remoteRef:
        key: authentik-secrets
        property: AUTHENTIK_URL
    - secretKey: cookie-domain
      remoteRef:
        key: authentik-secrets
        property: AUTHENTIK_COOKIE_DOMAIN
