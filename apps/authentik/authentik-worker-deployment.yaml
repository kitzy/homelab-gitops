apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-worker
  namespace: authentik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-worker
  template:
    metadata:
      labels:
        app: authentik-worker
    spec:
      containers:
      - name: worker
        image: ghcr.io/goauthentik/server:2024.12.1
        command:
        - worker
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        env:
        - name: AUTHENTIK_REDIS__HOST
          value: redis
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: postgres
        - name: AUTHENTIK_POSTGRESQL__NAME
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: postgres-db
        - name: AUTHENTIK_POSTGRESQL__USER
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: postgres-user
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: postgres-password
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: secret-key
        - name: AUTHENTIK_HOST
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: host
        - name: AUTHENTIK_COOKIE_DOMAIN
          valueFrom:
            secretKeyRef:
              name: authentik-secrets
              key: cookie-domain
        - name: AUTHENTIK_ERROR_REPORTING__ENABLED
          value: "false"
        - name: AUTHENTIK_DISABLE_UPDATE_CHECK
          value: "true"
        - name: AUTHENTIK_DISABLE_STARTUP_ANALYTICS
          value: "true"
        - name: AUTHENTIK_LOG_LEVEL
          value: info
        volumeMounts:
        - name: media
          mountPath: /media
        - name: templates
          mountPath: /templates
        - name: certs
          mountPath: /certs
      volumes:
      - name: media
        emptyDir: {}
      - name: templates
        emptyDir: {}
      - name: certs
        emptyDir: {}
