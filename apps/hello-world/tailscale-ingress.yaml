apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
  namespace: hello-world
  annotations:
    # Enable TLS with automatic Let's Encrypt certificates
    tailscale.com/tls: "true"
    # Override the generated hostname (namespace-ingressname)
    tailscale.com/hostname: "hello"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: hello-world
      port:
        number: 443
