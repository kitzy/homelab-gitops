apiVersion: v1
kind: Service
metadata:
  name: scanopy-server
  namespace: scanopy
spec:
  selector:
    app: scanopy-server
  ports:
  - name: http
    port: 60072
    targetPort: 60072
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanopy-server
  namespace: scanopy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scanopy-server
  template:
    metadata:
      labels:
        app: scanopy-server
    spec:
      containers:
      - name: server
        image: ghcr.io/scanopy/scanopy/server:latest
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        env:
        - name: SCANOPY_LOG_LEVEL
          value: "info"
        - name: SCANOPY_SERVER_PORT
          value: "60072"
        - name: SCANOPY_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: scanopy-secrets
              key: database-url
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: scanopy-secrets
              key: postgres-password
        - name: SCANOPY_WEB_EXTERNAL_PATH
          value: "/app/static"
        - name: SCANOPY_PUBLIC_URL
          value: "https://scanopy.tail26a1d8.ts.net"
        - name: SCANOPY_INTEGRATED_DAEMON_URL
          value: ""  # Daemon uses push mode
        ports:
        - containerPort: 60072
          name: http
        livenessProbe:
          httpGet:
            path: /
            port: 60072
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 60072
          initialDelaySeconds: 10
          periodSeconds: 10
