apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: scanopy-daemon
  namespace: scanopy
spec:
  selector:
    matchLabels:
      app: scanopy-daemon
  template:
    metadata:
      labels:
        app: scanopy-daemon
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false  # Prevent K8s service env var injection
      containers:
      - name: daemon
        image: ghcr.io/scanopy/scanopy/daemon:latest
        securityContext:
          privileged: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: SCANOPY_SERVER_URL
          value: "http://scanopy-server.scanopy.svc.cluster.local:60072"
        - name: SCANOPY_PORT
          value: "60073"
        - name: SCANOPY_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: SCANOPY_MODE
          value: "Push"
        volumeMounts:
        - name: daemon-config
          mountPath: /root/.config/daemon
        livenessProbe:
          httpGet:
            path: /api/health
            port: 60073
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 60073
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: daemon-config
        emptyDir: {}
