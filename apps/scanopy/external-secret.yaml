apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: scanopy-secrets
  namespace: scanopy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: scanopy-secrets
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: Scanopy Secrets
        property: POSTGRES_PASSWORD
