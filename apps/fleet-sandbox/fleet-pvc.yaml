apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fleet-vulndb
  namespace: fleet-sandbox
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fleet-logs
  namespace: fleet-sandbox
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
