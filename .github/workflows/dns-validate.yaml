name: DNS Validate

# Validate DNS changes on PRs touching dns/**: lint zones, run zone validation,
# and produce a Terraform plan (no apply). Mirrors the apply job's auth.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'dns/**'

permissions:
  contents: read

jobs:
  lint:
    name: Lint zones
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install yamllint pyyaml

      - name: Lint zone YAML
        run: yamllint -c dns/.yamllint.yml dns/dns_zones dns/cloudflare_tunnels.yml

      - name: Validate zone configuration
        run: python3 dns/scripts/validate_zones.py

  plan:
    name: Terraform plan
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the Terraform plan as a PR comment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load secrets from 1Password
        id: op-secrets
        uses: 1password/load-secrets-action@v2
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TF_API_TOKEN: op://GitHub/Terraform Cloud/credential
          AWS_ACCESS_KEY_ID: op://GitHub/AWS Route53/access_key_id
          AWS_SECRET_ACCESS_KEY: op://GitHub/AWS Route53/secret_access_key
          AWS_REGION: op://GitHub/AWS Route53/region
          CLOUDFLARE_API_TOKEN: op://GitHub/Cloudflare/api_token
          CLOUDFLARE_ACCOUNT_ID: op://GitHub/Cloudflare/account_id

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ steps.op-secrets.outputs.TF_API_TOKEN }}

      - name: Terraform fmt
        working-directory: dns/terraform
        run: terraform fmt -check

      - name: Terraform init
        working-directory: dns/terraform
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: dns/terraform
        run: terraform validate

      - name: Terraform plan
        id: plan
        continue-on-error: true # comment the result on the PR before failing on error
        working-directory: dns/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.op-secrets.outputs.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.op-secrets.outputs.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ steps.op-secrets.outputs.AWS_REGION }}
          TF_VAR_AWS_REGION: ${{ steps.op-secrets.outputs.AWS_REGION }}
          TF_VAR_CLOUDFLARE_API_TOKEN: ${{ steps.op-secrets.outputs.CLOUDFLARE_API_TOKEN }}
          TF_VAR_CLOUDFLARE_ACCOUNT_ID: ${{ steps.op-secrets.outputs.CLOUDFLARE_ACCOUNT_ID }}
        run: terraform plan -no-color -input=false

      - name: Comment plan on PR
        uses: actions/github-script@v7
        env:
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          PLAN_STDERR: ${{ steps.plan.outputs.stderr }}
        with:
          script: |
            const marker = '<!-- dns-terraform-plan -->';
            const stdout = process.env.PLAN_STDOUT || '';
            const stderr = process.env.PLAN_STDERR || '';
            const raw = (stderr ? stdout + '\n' + stderr : stdout).trim() || '(no output)';
            const max = 60000;
            const plan = raw.length > max
              ? raw.slice(0, max) + '\n\n... output truncated; see the workflow run logs for the full plan.'
              : raw;
            const ok = '${{ steps.plan.outputs.exitcode }}' === '0';
            const body = [
              marker,
              `## DNS Terraform plan ${ok ? '📋' : '❌'}`,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
              '',
              '*Merging to `main` runs `terraform apply`.*',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1
