name: Flux Reconcile

on:
  workflow_dispatch:
    inputs:
      kustomization:
        description: 'Kustomization to reconcile (leave empty for all)'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'infrastructure/**'
      - 'clusters/**'

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load secrets from 1Password
        id: op-secrets
        uses: 1password/load-secrets-action@v2
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TS_OAUTH_CLIENT_ID: op://GitHub/Tailscale/OAUTH_CLIENT_ID
          TS_OAUTH_SECRET: op://GitHub/Tailscale/OAUTH_SECRET
          KUBECONFIG_BASE64: op://GitHub/homelab-gitops/kubeconfig

      - name: Debug OAuth credentials
        run: |
          echo "Client ID: ${TS_OAUTH_CLIENT_ID}"
          echo "Client ID length: ${#TS_OAUTH_CLIENT_ID}"
          echo "Secret length: ${#TS_OAUTH_SECRET}"
          echo "Secret first 15 chars: ${TS_OAUTH_SECRET:0:15}"
          echo "Secret last 10 chars: ${TS_OAUTH_SECRET: -10}"
          
          # Check for whitespace
          if [[ "$TS_OAUTH_SECRET" =~ ^[[:space:]] ]]; then
            echo "ERROR: Secret starts with whitespace!"
          fi
          if [[ "$TS_OAUTH_SECRET" =~ [[:space:]]$ ]]; then
            echo "ERROR: Secret ends with whitespace!"
          fi
          if [[ "$TS_OAUTH_SECRET" =~ [[:space:]] ]]; then
            echo "WARNING: Secret contains internal whitespace!"
          fi
          
          # Verify format
          if [[ ! "$TS_OAUTH_SECRET" =~ ^tskey-client- ]]; then
            echo "ERROR: Secret doesn't start with 'tskey-client-'"
          fi
        env:
          TS_OAUTH_CLIENT_ID: ${{ steps.op-secrets.outputs.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ steps.op-secrets.outputs.TS_OAUTH_SECRET }}

      - name: Install Tailscale manually
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          
      - name: Start Tailscale daemon
        run: |
          sudo tailscaled --tun=userspace-networking --socks5-server=localhost:1055 &
          sleep 5
          
      - name: Authenticate with Tailscale (manual test)
        run: |
          # Combine OAuth credentials in the format Tailscale expects
          AUTH_KEY="${TS_OAUTH_CLIENT_ID}:${TS_OAUTH_SECRET}"
          
          echo "Attempting manual authentication..."
          echo "Auth key format: CLIENT_ID:SECRET"
          echo "Combined key length: ${#AUTH_KEY}"
          
          sudo tailscale up \
            --authkey="$AUTH_KEY" \
            --accept-routes \
            --hostname="github-runner-test" 2>&1 | tee /tmp/tailscale-auth.log || {
              echo "=== Authentication failed ==="
              echo "Exit code: $?"
              cat /tmp/tailscale-auth.log
              echo ""
              echo "=== Tailscale status ==="
              sudo tailscale status
              exit 1
            }
          
          echo "=== Authentication successful ==="
          sudo tailscale status
        env:
          TS_OAUTH_CLIENT_ID: ${{ steps.op-secrets.outputs.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ steps.op-secrets.outputs.TS_OAUTH_SECRET }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.33.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ steps.op-secrets.outputs.KUBECONFIG_BASE64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Reconcile Flux
        run: |
          if [ -n "${{ github.event.inputs.kustomization }}" ]; then
            echo "Reconciling kustomization: ${{ github.event.inputs.kustomization }}"
            flux reconcile kustomization ${{ github.event.inputs.kustomization }} --with-source
          else
            echo "Reconciling all kustomizations"
            flux reconcile source git flux-system
            flux reconcile kustomization infrastructure-sources --with-source
            flux reconcile kustomization infrastructure-core --with-source
            flux reconcile kustomization infrastructure-networking --with-source
            flux reconcile kustomization infrastructure-backups --with-source
            flux reconcile kustomization apps --with-source
          fi

      - name: Check Flux status
        if: always()
        run: |
          echo "=== Flux Sources ==="
          flux get sources git
          echo ""
          echo "=== Flux Kustomizations ==="
          flux get kustomizations
          echo ""
          echo "=== Flux Helm Releases ==="
          flux get helmreleases -A