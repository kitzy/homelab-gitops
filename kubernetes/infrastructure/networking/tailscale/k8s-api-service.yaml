apiVersion: v1
kind: Service
metadata:
  name: kubernetes-api
  namespace: default
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "k8s-api"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - name: https
      port: 6443
      targetPort: 6443
      protocol: TCP
  # This targets the actual Kubernetes API server endpoint
  # The endpoints are automatically created by Kubernetes
  selector: {}
---
# Create an Endpoints object to point to the actual K3s API servers
apiVersion: v1
kind: Endpoints
metadata:
  name: kubernetes-api
  namespace: default
subsets:
  - addresses:
      # Replace these with your actual control plane IPs
      # Get them with: kubectl get nodes -o wide
      - ip: 100.115.235.1  # Control plane 1
      - ip: 100.106.127.19  # Control plane 2
      - ip: 100.77.140.69  # Control plane 3
    ports:
      - name: https
        port: 6443
        protocol: TCP
