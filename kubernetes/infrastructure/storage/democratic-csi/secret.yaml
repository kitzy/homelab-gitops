apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: democratic-csi-credentials
  namespace: democratic-csi
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    # NOTE: intentionally NOT named "democratic-csi-driver-config" — the chart
    # auto-generates a Secret by that exact name (<fullname>-driver-config) to
    # hold the rendered driver-config-file.yaml. This Secret only carries the
    # credential env vars referenced as ${VAR} inside driver.config.
    name: democratic-csi-credentials
    creationPolicy: Owner
  data:
    - secretKey: DSM_USERNAME
      remoteRef:
        key: Synology DSM - democratic-csi
        property: username
    - secretKey: DSM_PASSWORD
      remoteRef:
        key: Synology DSM - democratic-csi
        property: password
    - secretKey: CHAP_PASSWORD
      remoteRef:
        key: iSCSI CHAP - k3s-storage
        property: password
