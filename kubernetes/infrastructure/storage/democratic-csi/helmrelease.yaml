apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi
  namespace: democratic-csi
spec:
  interval: 10m
  chart:
    spec:
      chart: democratic-csi
      version: 0.14.6
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    csiDriver:
      name: "org.democratic-csi.synology-iscsi"

    controller:
      driver:
        # Chart consumes this as a plain image string (not a repo/tag map).
        image: docker.io/democraticcsi/democratic-csi:latest
        # Credentials are injected as env vars and referenced as ${VAR}
        # inside driver.config (expanded by the driver at runtime).
        extraEnv:
          - name: DSM_USERNAME
            valueFrom:
              secretKeyRef:
                name: democratic-csi-credentials
                key: DSM_USERNAME
          - name: DSM_PASSWORD
            valueFrom:
              secretKeyRef:
                name: democratic-csi-credentials
                key: DSM_PASSWORD
          - name: CHAP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: democratic-csi-credentials
                key: CHAP_PASSWORD

    node:
      driver:
        image: docker.io/democraticcsi/democratic-csi:latest
        extraEnv:
          - name: DSM_USERNAME
            valueFrom:
              secretKeyRef:
                name: democratic-csi-credentials
                key: DSM_USERNAME
          - name: DSM_PASSWORD
            valueFrom:
              secretKeyRef:
                name: democratic-csi-credentials
                key: DSM_PASSWORD
          - name: CHAP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: democratic-csi-credentials
                key: CHAP_PASSWORD

    driver:
      config:
        driver: synology-iscsi
        # DSM API connection. The synology-iscsi driver reads connection
        # details from httpConnection (not the synology block); the scheme
        # is set via `protocol`, so `host` must NOT include https://.
        httpConnection:
          protocol: https
          host: "10.253.20.10"
          port: 5001
          username: "${DSM_USERNAME}"
          password: "${DSM_PASSWORD}"
          allowInsecure: true
          # unique per install against the same NAS
          session: "democratic-csi"
          serialize: true
        synology:
          # LUN location; getLocation() reads synology.volume.
          volume: "/volume1"
        iscsi:
          targetPortal: "10.253.20.11:3260"
          # The driver creates its own target per volume as baseiqn + name,
          # so no pre-created target/targetGroup is referenced.
          baseiqn: "iqn.2000-01.com.synology:csi."
          namePrefix: "csi-"
          nameSuffix: ""
          lunTemplate:
            type: "THIN"
          # CHAP is configured on the per-volume target, not targetGroups.
          # auth_type: 1 = CHAP (0 = none, 2 = mutual CHAP).
          targetTemplate:
            auth_type: 1
            max_sessions: 0
            user: "k3s"
            password: "${CHAP_PASSWORD}"
