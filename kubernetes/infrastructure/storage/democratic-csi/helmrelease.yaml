apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi
  namespace: democratic-csi
spec:
  interval: 10m
  chart:
    spec:
      chart: democratic-csi
      version: 0.14.6
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    csiDriver:
      name: "org.democratic-csi.synology-iscsi"

    storageClasses:
      - name: synology-iscsi
        defaultClass: true
        reclaimPolicy: Retain
        volumeBindingMode: Immediate
        allowVolumeExpansion: true

    controller:
      driver:
        image: docker.io/democraticcsi/democratic-csi:latest
        extraEnv:
          - name: DSM_USERNAME
            valueFrom:
              secretKeyRef:
                name: democratic-csi-credentials
                key: DSM_USERNAME
          - name: DSM_PASSWORD
            valueFrom:
              secretKeyRef:
                name: democratic-csi-credentials
                key: DSM_PASSWORD

    node:
      driver:
        image: docker.io/democraticcsi/democratic-csi:latest
        extraEnv:
          - name: DSM_USERNAME
            valueFrom:
              secretKeyRef:
                name: democratic-csi-credentials
                key: DSM_USERNAME
          - name: DSM_PASSWORD
            valueFrom:
              secretKeyRef:
                name: democratic-csi-credentials
                key: DSM_PASSWORD

    driver:
      config:
        driver: synology-iscsi
        httpConnection:
          protocol: https
          host: "10.253.20.10"
          port: 5001
          username: "${DSM_USERNAME}"
          password: "${DSM_PASSWORD}"
          allowInsecure: true
          session: "democratic-csi"
          serialize: true
        synology:
          volume: "/volume1"
        iscsi:
          targetPortal: "10.253.20.11:3260"
          baseiqn: "iqn.2000-01.com.synology:csi."
          namePrefix: "csi-"
          nameSuffix: ""
          lunTemplate:
            type: "THIN"
          targetTemplate:
            auth_type: 0
            max_sessions: 0
