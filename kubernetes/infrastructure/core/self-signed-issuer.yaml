apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
# NOTE: The selfsigned-ca Certificate resource was removed because the
# SelfSigned issuer has a known bug that caps cert duration at 90 days
# (https://github.com/cert-manager/cert-manager/issues/2637).
# The CA cert is now managed manually via openssl with a 10-year validity
# and stored directly in the selfsigned-ca-secret Secret.
# Current CA expires: 2036-03-31
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ca-issuer
spec:
  ca:
    secretName: selfsigned-ca-secret
