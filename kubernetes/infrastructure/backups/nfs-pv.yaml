apiVersion: v1
kind: PersistentVolume
metadata:
  name: backup-storage
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  nfs:
    server: 10gb-nas.kitzy.net
    path: /volume2/k8s-backups
  mountOptions:
    - hard
    - nfsvers=4.1
    - timeo=600
    - retrans=2
