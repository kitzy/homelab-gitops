apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: fleet
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: fleet
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        args:
        # Default is 128Mi, far too small for ~25 hosts' worth of
        # label_membership/query_results churn; was causing sustained
        # InnoDB row-lock waits and Fleet /healthz timeouts.
        - "--innodb-buffer-pool-size=1073741824"
        resources:
          requests:
            memory: "1536Mi"
            cpu: "1000m"
          limits:
            memory: "3Gi"
            cpu: "3000m"
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fleet-secrets
              key: mysql-root-password
        - name: MYSQL_DATABASE
          value: fleet
        - name: MYSQL_USER
          value: fleet
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fleet-secrets
              key: mysql-password
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 10
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: synology-iscsi
      resources:
        requests:
          storage: 20Gi
