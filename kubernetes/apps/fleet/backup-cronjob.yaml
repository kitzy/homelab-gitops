apiVersion: batch/v1
kind: CronJob
metadata:
  name: fleet-mysql-backup
  namespace: fleet
spec:
  schedule: "0 2 * * *"  # 02:00 daily
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
          containers:
          - name: backup
            image: mysql:8.0
            command:
            - /bin/bash
            - -c
            - |
              set -e
              BACKUP_FILE="/backups/fleet/fleet-$(date +%Y%m%d-%H%M%S).sql.gz"
              echo "Starting Fleet MySQL backup to $BACKUP_FILE"

              mysqldump \
                --host=mysql.fleet.svc.cluster.local \
                --user=root \
                --password="$MYSQL_ROOT_PASSWORD" \
                --single-transaction \
                --routines \
                --triggers \
                --events \
                fleet | gzip > "$BACKUP_FILE"

              echo "Backup completed: $(ls -lh $BACKUP_FILE)"

              # Verify the backup is readable and contains the core tables
              echo "Verifying backup integrity..."
              TABLES=$(zcat "$BACKUP_FILE" | grep -c "^-- Table structure for table")
              if [ "$TABLES" -lt 100 ]; then
                echo "ERROR: Backup verification failed - only $TABLES tables found (expected 100+), backup may be corrupt"
                rm -f "$BACKUP_FILE"
                exit 1
              fi
              for TABLE in users migration_status_tables hosts; do
                if ! zcat "$BACKUP_FILE" | grep -q "Table structure for table \`${TABLE}\`"; then
                  echo "ERROR: Backup verification failed - missing critical table: $TABLE"
                  rm -f "$BACKUP_FILE"
                  exit 1
                fi
              done
              echo "Backup verified: $TABLES tables present, all critical tables found"
            env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-secrets
                  key: mysql-root-password
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: backup-storage
