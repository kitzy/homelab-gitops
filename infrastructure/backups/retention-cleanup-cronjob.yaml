apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-retention-cleanup
  namespace: backups
spec:
  schedule: "0 3 * * *"  # 03:00 daily (after backups complete)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: cleanup
            image: alpine:3.19
            command:
            - /bin/sh
            - -c
            - |
              set -e

              cleanup_directory() {
                DIR=$1
                echo "Cleaning up $DIR"
                cd "$DIR" || return

                # Keep last 7 daily backups
                ls -t *.sql.gz 2>/dev/null | tail -n +8 | while read f; do
                  # Check if it's a Sunday (weekly) or 1st of month (monthly)
                  DATE=$(echo "$f" | grep -oE '[0-9]{8}')
                  DOW=$(date -d "${DATE:0:4}-${DATE:4:2}-${DATE:6:2}" +%u 2>/dev/null || echo 0)
                  DOM=$(date -d "${DATE:0:4}-${DATE:4:2}-${DATE:6:2}" +%d 2>/dev/null || echo 0)

                  # Keep if Sunday (weekly backup)
                  if [ "$DOW" = "7" ]; then
                    WEEKLY_COUNT=$(ls -t *.sql.gz 2>/dev/null | grep -E "$(date -d "${DATE:0:4}-${DATE:4:2}-${DATE:6:2}" +%Y%m).*" | wc -l)
                    if [ "$WEEKLY_COUNT" -le 4 ]; then
                      echo "Keeping weekly backup: $f"
                      continue
                    fi
                  fi

                  # Keep if 1st of month (monthly backup)
                  if [ "$DOM" = "01" ]; then
                    MONTHLY_COUNT=$(ls -t *.sql.gz 2>/dev/null | grep -E "$(date -d "${DATE:0:4}-${DATE:4:2}-01" +%Y).*" | wc -l)
                    if [ "$MONTHLY_COUNT" -le 3 ]; then
                      echo "Keeping monthly backup: $f"
                      continue
                    fi
                  fi

                  # Otherwise delete
                  echo "Deleting old backup: $f"
                  rm -f "$f"
                done
              }

              cleanup_directory "/backups/fleet"
              cleanup_directory "/backups/scanopy"

              echo "Retention cleanup completed"
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
            resources:
              requests:
                memory: "64Mi"
                cpu: "50m"
              limits:
                memory: "128Mi"
                cpu: "100m"
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: backup-storage
