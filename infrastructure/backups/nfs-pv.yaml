apiVersion: v1
kind: PersistentVolume
metadata:
  name: backup-storage
spec:
  capacity:
    storage: 1Ti  # Arbitrary, NFS doesn't enforce
  accessModes:
    - ReadWriteMany
  nfs:
    server: 10gb-nas.kitzy.net
    path: /volume1/k8s-backups
  mountOptions:
    - hard
    - nfsvers=4.1
    - timeo=600
    - retrans=2