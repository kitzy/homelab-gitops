apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 24h
  url: https://kubernetes.github.io/ingress-nginx
---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 30m
  chart:
    spec:
      chart: ingress-nginx
      version: "4.11.x"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: ingress-nginx
  values:
    controller:
      service:
        type: LoadBalancer
        loadBalancerIP: 10.253.20.85
        annotations:
          metallb.universe.tf/address-pool: ingress-pool

      # Large file upload configuration
      config:
        proxy-body-size: "2048m"
        proxy-connect-timeout: "600"
        proxy-send-timeout: "600"
        proxy-read-timeout: "600"
        proxy-buffering: "off"
        client-header-buffer-size: "64k"
        large-client-header-buffers: "4 64k"
        client-body-buffer-size: "1m"
        client-max-body-size: "2048m"

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

      # Metrics for Prometheus
      metrics:
        enabled: true
        serviceMonitor:
          enabled: false

      # HA configuration
      replicaCount: 2

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - ingress-nginx
              topologyKey: kubernetes.io/hostname
